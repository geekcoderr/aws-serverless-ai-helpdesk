name: Deploy AWS Serverless AI Helpdesk

on:
  push:
    branches:
      - main

# Standard permissions for checkout
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  # TODO: Replace with your AWS Account ID and ECR Repository name
  ECR_REPOSITORY: email-injest-lambda
  AWS_ACCOUNT_ID: "${{ secrets.AWS_ACCOUNT_ID }}"
  # TODO: Replace with the exact names of your two Lambda functions in AWS
  MAIN_LAMBDA_NAME: "ProcessInboundEmail"
  DLQ_LAMBDA_NAME: "ProcessInboundEmailDLQ"
  WEBHOOK_LAMBDA_NAME: "JiraWebhookListener"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # CRITICAL: Only run this job if the commit message contains 'ACTION: Deployment'
    if: "contains(github.event.head_commit.message, 'ACTION: Deployment')"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          # Push both tags to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Output the image URI for the next step
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Main Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.MAIN_LAMBDA_NAME }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update DLQ Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.DLQ_LAMBDA_NAME }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update Webhook Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.WEBHOOK_LAMBDA_NAME }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Wait for Lambda Functions to Update
        run: |
          aws lambda wait function-updated --function-name ${{ env.MAIN_LAMBDA_NAME }}
          aws lambda wait function-updated --function-name ${{ env.DLQ_LAMBDA_NAME }}
          aws lambda wait function-updated --function-name ${{ env.WEBHOOK_LAMBDA_NAME }}
